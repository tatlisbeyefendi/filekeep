[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filekeep"
version = "0.1.0"
description = "Index, search, dedupe, sort and safely delete the files on your disk from one CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tatlisbeyefendi", email = "coincolicman@gmail.com" }]
keywords = ["files", "cli", "duplicates", "organize", "index", "disk", "dedupe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
filekeep = "filekeep.cli:main"
fk = "filekeep.cli:main"

[project.urls]
Homepage = "https://github.com/tatlisbeyefendi/filekeep"
Issues = "https://github.com/tatlisbeyefendi/filekeep/issues"
Changelog = "https://github.com/tatlisbeyefendi/filekeep/blob/main/CHANGELOG.md"
Source = "https://github.com/tatlisbeyefendi/filekeep"

[tool.hatch.build.targets.wheel]
packages = ["src/filekeep"]

[tool.hatch.build.targets.sdist]
include = ["src/filekeep", "tests", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["filekeep"]
branch = true
