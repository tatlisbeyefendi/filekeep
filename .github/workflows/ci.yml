name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Check
        run: |
          python -m ruff check .
          python -m ruff format --check .

  wheel:
    name: build and smoke test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install -q build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/filekeep --version
      - name: Scan a real tree and query it
        run: |
          mkdir -p /tmp/demo/photos /tmp/demo/code
          printf 'same' > /tmp/demo/photos/a.jpg
          printf 'same' > /tmp/demo/photos/b.jpg
          printf 'print(1)' > /tmp/demo/code/app.py
          export FILEKEEP_HOME=/tmp/demo-home
          /tmp/smoke/bin/filekeep scan /tmp/demo --hash always
          /tmp/smoke/bin/filekeep dupes
          /tmp/smoke/bin/filekeep ls --kind image
          /tmp/smoke/bin/filekeep stats
          /tmp/smoke/bin/filekeep doctor
